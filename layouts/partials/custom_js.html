<script>
(function () {
  'use strict';
  function initHorizontalHome() {
    if (window.__HORIZONTAL_HOME_READY__) return;
    var main = document.querySelector('main');
    if (!main) return;

    var candidates = Array.prototype.slice.call(main.querySelectorAll('.home-section'));
    var slides = candidates.filter(function (el) {
      return el.parentElement === main;
    });
    if (slides.length < 2) return;

    window.__HORIZONTAL_HOME_READY__ = true;
    document.documentElement.classList.add('horizontal-home');
    document.body.classList.add('horizontal-home');

    var track = document.createElement('div');
    track.className = 'horizontal-home-track';
    track.setAttribute('role', 'region');
    track.setAttribute('aria-label', '首页横向内容');

    slides.forEach(function (slide) {
      slide.classList.add('horizontal-home-slide');
      track.appendChild(slide);
    });
    main.appendChild(track);

    var controls = document.createElement('div');
    controls.className = 'horizontal-home-controls';
    controls.setAttribute('aria-label', '首页分页');

    function goTo(index) {
      index = Math.max(0, Math.min(slides.length - 1, index));
      track.scrollTo({ left: index * track.clientWidth, behavior: 'smooth' });
    }

    slides.forEach(function (_, i) {
      var dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'horizontal-home-dot';
      dot.setAttribute('aria-label', '第 ' + (i + 1) + ' 页');
      dot.addEventListener('click', function () { goTo(i); });
      controls.appendChild(dot);
    });
    document.body.appendChild(controls);

    function addArrow(cls, label, direction) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'horizontal-home-arrow ' + cls;
      button.innerHTML = direction > 0 ? '&#8250;' : '&#8249;';
      button.setAttribute('aria-label', label);
      button.addEventListener('click', function () {
        var current = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
        goTo(current + direction);
      });
      document.body.appendChild(button);
    }
    addArrow('horizontal-home-arrow--previous', '上一页', -1);
    addArrow('horizontal-home-arrow--next', '下一页', 1);

    function updatePagination() {
      var width = Math.max(1, track.clientWidth);
      var index = Math.round(track.scrollLeft / width);
      controls.querySelectorAll('.horizontal-home-dot').forEach(function (dot, i) {
        dot.classList.toggle('is-active', i === index);
      });
    }

    track.addEventListener('scroll', function () {
      window.requestAnimationFrame(updatePagination);
    }, { passive: true });

    document.addEventListener('keydown', function (e) {
      var tag = document.activeElement && document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); var r = Math.round(track.scrollLeft / track.clientWidth); goTo(r + 1); }
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); var l = Math.round(track.scrollLeft / track.clientWidth); goTo(l - 1); }
      if (e.key === 'Home') { e.preventDefault(); goTo(0); }
      if (e.key === 'End') { e.preventDefault(); goTo(slides.length - 1); }
    });

    track.addEventListener('wheel', function (e) {
      if (Math.abs(e.deltaY) >= Math.abs(e.deltaX)) {
        e.preventDefault();
        track.scrollLeft += e.deltaY;
      }
    }, { passive: false });

    var pointerDown = false;
    var startX = 0;
    var startScroll = 0;
    var moved = false;

    track.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      pointerDown = true;
      moved = false;
      startX = e.clientX;
      startScroll = track.scrollLeft;
      track.classList.add('is-dragging');
      try { track.setPointerCapture(e.pointerId); } catch (_) {}
    });
    track.addEventListener('pointermove', function (e) {
      if (!pointerDown) return;
      var dx = e.clientX - startX;
      if (Math.abs(dx) > 4) moved = true;
      track.scrollLeft = startScroll - dx;
    });
    function endPointer(e) {
      if (!pointerDown) return;
      pointerDown = false;
      track.classList.remove('is-dragging');
      var dx = e.clientX - startX;
      if (moved && Math.abs(dx) > 40) {
        var current = Math.round(startScroll / Math.max(1, track.clientWidth));
        goTo(current + (dx < 0 ? 1 : -1));
      } else {
        var nearest = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
        goTo(nearest);
      }
    }
    track.addEventListener('pointerup', endPointer);
    track.addEventListener('pointercancel', endPointer);

    window.addEventListener('resize', function () {
      var current = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
      window.requestAnimationFrame(function () { goTo(current); });
    });

    updatePagination();
  }

  function boot() { initHorizontalHome(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
  window.addEventListener('load', boot);
  setTimeout(boot, 300);
  setTimeout(boot, 1000);
  setTimeout(boot, 2000);
})();
</script>
