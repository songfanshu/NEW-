<script>
(function () {
  'use strict';
  function init() {
    if (window.__HORIZONTAL_HOME_READY__) return;
    var main = document.querySelector('main');
    if (!main) return;
    var slides = Array.prototype.slice.call(main.querySelectorAll(':scope > .home-section'));
    if (slides.length < 2) return;
    window.__HORIZONTAL_HOME_READY__ = true;

    var track = document.createElement('div');
    track.className = 'horizontal-home-track';
    slides.forEach(function (slide) {
      slide.classList.add('horizontal-home-slide');
      track.appendChild(slide);
    });
    main.appendChild(track);
    document.documentElement.classList.add('horizontal-home');
    document.body.classList.add('horizontal-home');

    var dots = document.createElement('div');
    dots.className = 'horizontal-home-controls';
    dots.setAttribute('aria-label', '首页分页');
    slides.forEach(function (_, i) {
      var dot = document.createElement('button');
      dot.type = 'button'; dot.className = 'horizontal-home-dot';
      dot.setAttribute('aria-label', '第 ' + (i + 1) + ' 页');
      dot.onclick = function () { track.scrollTo({left: i * track.clientWidth, behavior: 'smooth'}); };
      dots.appendChild(dot);
    });
    document.body.appendChild(dots);

    function button(cls, label, dir) {
      var b = document.createElement('button');
      b.type='button'; b.className='horizontal-home-arrow ' + cls; b.innerHTML=dir > 0 ? '&#8250;' : '&#8249;'; b.setAttribute('aria-label',label);
      b.onclick=function(){ track.scrollBy({left: dir * track.clientWidth, behavior:'smooth'}); };
      document.body.appendChild(b); return b;
    }
    button('horizontal-home-arrow--previous','上一页',-1);
    button('horizontal-home-arrow--next','下一页',1);

    function update() {
      var index = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
      dots.querySelectorAll('.horizontal-home-dot').forEach(function(d,i){ d.classList.toggle('is-active',i===index); });
    }
    track.addEventListener('scroll', function(){ requestAnimationFrame(update); }, {passive:true});
    window.addEventListener('keydown', function(e){
      var t=document.activeElement && document.activeElement.tagName;
      if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT') return;
      if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();track.scrollBy({left:track.clientWidth,behavior:'smooth'});}
      if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();track.scrollBy({left:-track.clientWidth,behavior:'smooth'});}
      if(e.key==='Home'){e.preventDefault();track.scrollTo({left:0,behavior:'smooth'});}
      if(e.key==='End'){e.preventDefault();track.scrollTo({left:track.scrollWidth,behavior:'smooth'});}
    });
    track.addEventListener('wheel',function(e){
      if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();track.scrollBy({left:e.deltaY,behavior:'auto'});}
    },{passive:false});

    var dragging=false,startX=0,startScroll=0;
    track.addEventListener('mousedown',function(e){ dragging=true; startX=e.pageX; startScroll=track.scrollLeft; track.classList.add('is-dragging'); });
    window.addEventListener('mousemove',function(e){if(dragging) track.scrollLeft=startScroll-(e.pageX-startX);});
    window.addEventListener('mouseup',function(){dragging=false;track.classList.remove('is-dragging');});
    track.addEventListener('mouseleave',function(){if(dragging){dragging=false;track.classList.remove('is-dragging');}});
    window.addEventListener('resize',update);
    update();
  }
  function boot(){init();}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
  window.addEventListener('load',boot);
  setTimeout(boot,500); setTimeout(boot,1500);
})();
</script>
