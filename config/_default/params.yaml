appearance:
  theme_day: minimal
  theme_night:
  font: native
  font_size: L

marketing:
  seo:
    site_type: Organization
    local_business_type: ''
    org_name: 实验室科研团队
    description: 实验室科研团队，开展先进材料、光电器件与智能感知等方向的科研与人才培养。
    twitter: ''
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    google_tag_manager: ''
    microsoft_clarity: ''
  verification:
    google: ''
    baidu: ''

header:
  navbar:
    enable: true
    align: r
    show_logo: true
    show_language: false
    show_day_night: true
    show_search: true
    highlight_active_link: false

footer:
  copyright:
    notice: '© {year} 实验室科研团队。保留所有权利。'
    license:
      enable: false
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

locale:
  date_format: '2006年1月2日'
  time_format: '15:04'
  address_format: zh-cn

features:
  syntax_highlighter:
    enable: false
    extra_languages:
      - r
      - latex
  math:
    enable: false
  privacy_pack:
    enable: false
  repository:
    url: 'https://github.com/songfanshu/NEW-'
    content_dir: content
    branch: main
  avatar:
    gravatar: false
    shape: circle
  comment:
    provider: ''
    disqus:
      shortname: ''
      show_count: true
    commento:
      url: ''
    giscus:
      repo: ''
      repo_id: ''
      category: ''
      category_id: ''
  search:
    provider: wowchemy
    algolia:
      app_id: ''
      api_key: ''
      index_name: ''
      show_logo: false
  map:
    provider: 'mapnik'
    api_key: ''
    zoom: 15

extensions:
  decap_cms:
    branch: main
    local_backend: false
  academicons:
    enable: true

publications:
  date_format: '2006年1月'
  citation_style: apa
